<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Band Name — Links</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient">

  <main class="page">
    <header class="site-header">
      <h1 class="site-title" data-kerning-curve="v">Slight Of</h1>
      <h2 class="site-subtitle">glam rock for the glamor/ess</h2>
    </header>

<iframe style="border: 0; width: 100%; height: 120px; border-radius: 15px; margin-bottom: 50px;" src="https://bandcamp.com/EmbeddedPlayer/track=1892003469/size=large/bgcol=333333/linkcol=ffffff/tracklist=false/artwork=small/transparent=true/" seamless><a href="https://slightofband.bandcamp.com/track/motorbike-2">Motorbike by Slight Of</a></iframe>    
    <nav class="link-list">

        <a class="link-pill" href="https://partiful.com/e/p9BDH8K6RJyRwdlg71q6" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"></span>
            <cite class="link-label"></cite>
        </a>

        <a class="link-pill" href="https://slightofband.bandcamp.com" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"></span>
            <cite class="link-label">Bandcamp</cite>
        </a>


        <a class="link-pill" href="https://www.instagram.com/slightofband/" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"></span>
            <cite class="link-label"></cite>
        </a>

        <a class="link-pill" href="https://www.youtube.com/@slightofband" target="_blank" rel="noopener noreferrer">
            <span class="link-icon"></span>
            <cite class="link-label"></cite>
        </a>
    </nav>
  </main>
  <p>I built this site.<br>Use it if you'd like.</p>
  <script>
    // Give the title a V-shaped kerning curve: wide at the edges, tight in the center.
    document.querySelectorAll('[data-kerning-curve="v"]').forEach((el) => {
      const text = el.textContent;
      const maxSpacing = 0.45; // em, spacing at the outermost letters
      const chars = [...text];
      el.textContent = '';
      chars.forEach((char, i) => {
        const span = document.createElement('span');
        span.textContent = char === ' ' ? '\u00A0' : char;
        const t = chars.length > 1 ? (i - (chars.length - 1) / 2) / ((chars.length - 1) / 2) : 0;
        span.style.marginRight = i < chars.length - 1 ? `${maxSpacing * Math.abs(t)}em` : '0';
        el.appendChild(span);
      });
    });

    // link og image + label
    document.querySelectorAll('.link-pill[href]').forEach((pill) => {
      const { hostname } = new URL(pill.href);
      const faviconUrl = `https://www.google.com/s2/favicons?sz=128&domain=${hostname}`;
      pill.style.setProperty('--og-image', `url("${faviconUrl}")`);

      const label = pill.querySelector('.link-label');
      if (!label || label.textContent.trim() !== '') return;

      // Fallback name derived from the domain, e.g. "www.bandcamp.com" -> "Bandcamp"
      const parts = hostname.replace(/^www\./, '').split('.');
      const fallbackName = parts.length > 1 ? parts[parts.length - 2] : parts[0];
      label.textContent = fallbackName.charAt(0).toUpperCase() + fallbackName.slice(1);

      // Replace the fallback with the page's actual <title> via a CORS-enabled metadata API.
      fetch(`https://api.microlink.io/?url=${encodeURIComponent(pill.href)}`)
        .then((res) => res.json())
        .then((json) => {
          const title = json?.data?.title;
          if (title) label.textContent = title;
        })
        .catch(() => {
          // Keep the domain-derived fallback name if the lookup fails.
        });
    });
  </script>
</body>
</html>
